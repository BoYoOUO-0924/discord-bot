<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>嘎哇管理後台</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- 登入畫面 -->
  <main id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <h1>🎮 嘎哇管理後台</h1>
      <p class="muted">請輸入 .env 裡設定的 ADMIN_PASSWORD</p>
      <label for="password">密碼</label>
      <input id="password" type="password" autocomplete="current-password" required autofocus>
      <p id="login-error" class="error" role="alert"></p>
      <button type="submit" class="btn primary">登入</button>
    </form>
  </main>

  <!-- 後台主畫面 -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="brand">🎮 嘎哇管理後台</div>
      <nav class="tabs" aria-label="主選單">
        <a href="#/overview" data-tab="overview">總覽</a>
        <a href="#/users" data-tab="users">使用者</a>
        <a href="#/games" data-tab="games">遊戲</a>
        <a href="#/serverlog" data-tab="serverlog">伺服器紀錄</a>
        <a href="#/logs" data-tab="logs">操作紀錄</a>
      </nav>
      <div class="topbar-right">
        <span id="bot-status" class="status-pill" title="bot 狀態">…</span>
        <button id="theme-toggle" class="btn ghost" type="button" aria-label="切換深色／淺色">🌓</button>
        <button id="logout" class="btn ghost" type="button">登出</button>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="tooltip" class="tooltip" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
